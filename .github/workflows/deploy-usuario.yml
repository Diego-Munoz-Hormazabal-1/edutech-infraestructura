name: CD/CD Usuario_1 MS

on:
  push:
    branches:
      - main
    paths:
      - 'Usuario_1/**' # Solo se activa si haces cambios dentro de la carpeta del microservicio de Usuario

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código en el servidor temporal de GitHub
    - name: Checkout del código
      uses: actions/checkout@v3

    # 2. Configurar Java para compilar el proyecto (Ajusta la versión si usas Java 17 u otra)
    - name: Configurar JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compilar el microservicio de Usuario usando su propio pom.xml
    - name: Compilar Usuario_1 con Maven
      run: mvn -f Usuario_1/pom.xml clean package -DskipTests

    # 4. Iniciar sesión en tu Docker Hub de forma segura
    - name: Login en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Construir la imagen Docker usando el Dockerfile de Usuario_1 y subirla a tu Docker Hub
    - name: Construir y subir imagen Docker
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/ms-usuario:latest ./Usuario_1
        docker push ${{ secrets.DOCKER_USERNAME }}/ms-usuario:latest

    # 6. Conectarse a tu AWS EC2 y actualizar el contenedor
    - name: Desplegar en AWS EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          # Descargar la imagen más reciente que acabamos de subir a Docker Hub
          docker pull ${{ secrets.DOCKER_USERNAME }}/ms-usuario:latest
          
          # Apagar y eliminar el contenedor viejo si es que ya estaba corriendo en AWS
          docker stop ms-usuario-container || true
          docker rm ms-usuario-container || true
          
          # Levantar el nuevo contenedor mapeando el puerto de tu microservicio de Usuario
          # NOTA: Cambia "8081:8081" por el puerto real que use tu microservicio de Usuario (ej. 8080:8080 o el que tengas configurado)
          docker run -d --name ms-usuario-container -p 8081:8081 ${{ secrets.DOCKER_USERNAME }}/ms-usuario:latest