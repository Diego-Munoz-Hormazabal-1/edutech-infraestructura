name: CD/CD Usuario_1 MS

on:
  push:
    branches:
      - main
    paths:
      - 'Usuario_1/**' # Solo se activa si haces cambios en Usuario_1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código
    - name: Checkout del código
      uses: actions/checkout@v3

    # 2. Configurar Java
    - name: Configurar JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compilar microservicio
    - name: Compilar Usuario_1 con Maven
      run: mvn -f Usuario_1/pom.xml clean package -DskipTests

    # 4. Login en Docker Hub
    - name: Login en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Construir y subir imagen
    - name: Construir y subir imagen Docker
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/ms-usuario:latest ./Usuario_1
        docker push ${{ secrets.DOCKER_USERNAME }}/ms-usuario:latest

    # 6. Desplegar en AWS EC2
    - name: Desplegar en AWS EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          # 1. Descargar la nueva versión de tu imagen con permisos sudo
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ms-usuario:latest
          
          # 2. Detener y remover el contenedor de usuario actual usando sudo
          sudo docker stop ms-usuario || true
          sudo docker rm ms-usuario || true
          
          # 3. Levantar tu nueva imagen en caliente con sudo
          sudo docker run -d \
            --name ms-usuario \
            --network edutech-infraestructura_default \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/ms-usuario:latest